/**:
  ros__parameters:
    output_base_directory: "./ros_bag/gantry_collision"
    bag_name_prefix: "rtg_654_gantry_collision"
    plc_topic: "/rtg/plc_topic_35"
    alarm_topic: "/algl/GantryColDetMsg"

    # 对齐 controller_api_node.py：距离严格小于阈值，减速和停止都属于报警。
    # left 仅处理区域 1/3，right 仅处理区域 2/4。
    slow_distance_m: 16.0
    stop_distance_m: 5.5
    # 报警前预录，0 关闭；容量为每个左右实例的序列化消息上限，不含 DDS/写盘开销。
    pre_record_seconds: 2.0
    # 每条有效报警将结束时间刷新为当前时间加5秒。
    post_record_seconds: 5.0
    # 从报警触发开始计算的最大录制时长；正常仍在后录窗口结束时关闭。
    max_record_seconds: 120.0
    pre_record_max_mb: 256

    # 仅检查连续数据流 PLC/点云；报警结果是按变化发布，不能按此超时判解除。
    data_timeout_seconds: 3.0
    # 低于此可用空间时故障退出，保留已有数据，不删除旧包。0 关闭空间预检查。
    min_free_space_gb: 2.0
    # 单个 DB3 分卷大小，不是事件停止条件。
    max_bagfile_size_mb: 1024

# 默认 654；与 recorder_654.yaml 的参数一致。IP 仅作设备核对，不配置驱动。
gantry_collision_bag_recorder_left:
  ros__parameters:
    collision_side: "left"
    lidar_topics:
      - "/livox/lidar_3GGDJA600101431"  # L21 | 区域1 | 10.141.54.101
      - "/livox/lidar_3GGDJA500101151"  # L18 | 区域3 | 10.141.54.98
      - "/livox/lidar_3GGDJ9S00100741"  # L20 | 区域2 | 10.141.54.100
      - "/livox/lidar_3GGDJA600101201"  # L19 | 区域4 | 10.141.54.99

gantry_collision_bag_recorder_right:
  ros__parameters:
    collision_side: "right"
    lidar_topics:
      - "/livox/lidar_3GGDJA600101431"  # L21 | 区域1 | 10.141.54.101
      - "/livox/lidar_3GGDJA500101151"  # L18 | 区域3 | 10.141.54.98
      - "/livox/lidar_3GGDJ9S00100741"  # L20 | 区域2 | 10.141.54.100
      - "/livox/lidar_3GGDJA600101201"  # L19 | 区域4 | 10.141.54.99
